name: 更新法規資料並部署網頁

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *"   # 每天臺灣時間 03:17 去法務部抓一次
  workflow_dispatch:         # 也可以在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 測試解析與同步邏輯
        run: |
          node tests/core.test.js
          node tests/sync.test.js

      - name: 安裝套件
        run: pip install requests

      - name: 組合網站並下載法規資料
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r vendor js _site/
          touch _site/.nojekyll
          python scripts/build_data.py _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
