<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法規查閱與匯出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f0; --panel:#ffffff; --ink:#24252a; --muted:#6b6d74; --line:#e3e1d8;
    --accent:#3d5a80; --accent-soft:#e7edf5; --mark:#ffe58a; --danger:#a33a3a; --fs:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7}
  button,input,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}
  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}
  .mobile-only{display:none!important}

  /* ---- 左側 ---- */
  .side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .brand{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:8px}
  .brand h1{margin:0;font-size:18px;letter-spacing:.05em}
  .brand .sub{font-size:12px;color:var(--muted)}
  .brand .x{margin-left:auto}
  .search{padding:12px 14px;border-bottom:1px solid var(--line)}
  .field{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fbfbf8;outline:none}
  .field:focus{border-color:var(--accent);background:#fff}
  .results{flex:1;overflow:auto;padding:6px 8px}
  .sec{font-size:12px;font-weight:700;color:var(--muted);padding:10px 10px 4px;display:flex;align-items:center;gap:6px}
  .law-item{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer;line-height:1.45}
  .law-item:hover{background:#f1f0ea}
  .law-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .law-item .meta{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:#eee;color:#555;margin-left:4px;vertical-align:1px}
  .tag.gone{background:#f6e3e3;color:var(--danger)}
  .tag.new{background:#fff1c2;color:#7a5b00}
  .hint{font-size:12.5px;color:var(--muted);padding:8px 10px}
  .vault{margin:4px 6px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf6;font-size:12.5px}
  .vault .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .datainfo{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted)}
  .datainfo .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.small{padding:2px 9px;font-size:12px}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}
  .x{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--muted);padding:2px 6px}

  /* ---- 右側 ---- */
  .main{min-width:0;min-height:0;overflow:auto;position:relative}
  .empty{max-width:640px;margin:48px auto;padding:0 20px}
  .empty h2{font-size:20px;margin:0 0 6px}
  .steps{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 20px 14px;margin:16px 0}
  .steps ol{padding-left:20px}
  .steps li{margin:8px 0}
  .drop{display:block;border:2px dashed #c9c6b8;border-radius:12px;padding:26px;text-align:center;background:#fbfaf6;cursor:pointer;transition:.15s}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop strong{display:block;font-size:16px}
  .status{margin-top:12px;font-size:13.5px;color:var(--muted);min-height:1.5em}
  .status.err{color:var(--danger)}
  .lawhead{position:sticky;top:0;z-index:5;background:rgba(246,245,240,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:12px 24px 10px}
  .titlerow{display:flex;align-items:center;gap:10px}
  .lawhead h2{margin:0;font-size:20px;flex:1;min-width:0}
  .lawhead .meta{font-size:12.5px;color:var(--muted)}
  .lawhead .meta a{cursor:pointer}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .toolbar .field{width:auto;flex:1 1 170px;max-width:260px;padding:6px 10px}
  .toolbar .jump{flex:0 1 140px}
  .toolbar .spacer{flex:1}
  .count{font-size:12.5px;color:var(--muted)}
  .dd{position:relative}
  .menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:230px;z-index:30}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;line-height:1.4}
  .menu button:hover{background:#f1f0ea}
  .menu button small{display:block;color:var(--muted);font-size:11.5px}
  .menu button.cur{color:var(--accent);font-weight:500}
  .menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
  .body{display:grid;grid-template-columns:230px 1fr;gap:0}
  .toc{position:sticky;top:var(--headh,110px);align-self:start;max-height:calc(100vh - var(--headh,110px));overflow:auto;padding:14px 8px 30px 18px;font-size:13px;border-right:1px solid var(--line)}
  .toc .tochead{display:none}
  .toc a{display:block;text-decoration:none;color:var(--ink);padding:3px 6px;border-radius:5px;line-height:1.4}
  .toc a:hover{background:#ecebe4}
  .toc .l1{font-weight:700;margin-top:6px}
  .toc .l2{padding-left:16px}
  .toc .l3{padding-left:28px;color:#4a4b52}
  .toc .l4,.toc .l5{padding-left:40px;color:#5b5c63}
  .content{padding:10px 32px 80px;max-width:900px;font-size:var(--fs)}
  .h{text-align:center;margin:28px 0 10px;scroll-margin-top:calc(var(--headh,110px) + 8px)}
  .h.l1{font-size:1.25em}.h.l2{font-size:1.12em}.h.l3,.h.l4,.h.l5{font-size:1.03em}
  .art{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px 12px;margin:10px 0;scroll-margin-top:calc(var(--headh,110px) + 8px)}
  .art.flash,.para.flash{box-shadow:0 0 0 3px var(--mark);border-radius:6px}
  .art .no{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--accent);gap:6px}
  .art .acts{display:flex;gap:6px}
  .art .txt{margin-top:2px}
  .para{display:grid;grid-template-columns:1fr;column-gap:12px;scroll-margin-top:calc(var(--headh,110px) + 8px)}
  .multi .para{grid-template-columns:1.4em 1fr}
  .pn{display:none}
  .multi .pn{display:block;text-align:right;font-style:italic;color:var(--muted);border-right:2px solid var(--line);padding-right:8px}
  .ln{white-space:pre-wrap}
  .ln.m{margin-left:2em}
  a.ref{color:var(--accent);text-decoration:none;border-bottom:1px dashed rgba(61,90,128,.5)}
  a.ref:hover{background:var(--accent-soft)}
  .art .copy{opacity:0;transition:.15s}
  .art:hover .copy{opacity:1}
  mark{background:var(--mark);padding:0 1px;border-radius:2px}
  /* 背誦模式 */
  .veil .para:not(.open) .pb{background:repeating-linear-gradient(-45deg,#e9e7de 0 6px,#f1efe8 6px 12px);color:transparent;border-radius:6px;cursor:pointer;user-select:none}
  .veil .para:not(.open) .pb *{color:transparent!important;border-color:transparent!important;background:none!important}
  .cz{background:#e2e0d6;color:transparent;border-radius:4px;cursor:pointer;padding:0 2px;user-select:none}
  .cz.open{background:#fff1c2;color:inherit}
  .recite-tip{font-size:12.5px;color:var(--muted);margin:8px 0 0}

  .foot{font-size:11.5px;color:var(--muted);padding:20px 32px 30px;border-top:1px solid var(--line)}
  .banner{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:flex-start;background:#fff8dc;border-bottom:1px solid #eadfae;padding:9px 20px;font-size:13.5px}
  .banner.ok{background:#e9f4ea;border-color:#c5e0c8}
  .banner.warn{background:#fbecec;border-color:#ecc9c9}
  .banner .x{margin-left:auto;font-size:16px}
  .banner .btn{margin-left:6px}
  .main.has-banner .lawhead{top:var(--bannerh,40px)}
  .modal{position:fixed;inset:0;background:rgba(30,30,35,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal-card{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
  .modal-head .x{margin-left:auto}
  .modal-body{padding:14px 18px 18px;overflow:auto;font-size:14px}
  .modal-body ol{padding-left:22px;margin:0}
  .modal-body li{margin:6px 0;white-space:pre-wrap}
  .modal-body textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13.5px}
  .modal-body details{margin-top:10px;font-size:12.5px;color:var(--muted)}
  .sum{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
  .sum b{display:block}
  .bar{height:6px;background:#eceae2;border-radius:3px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .backdrop{display:none}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2d2f36;color:#fff;padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:90vw}
  .toast.show{opacity:1}

  /* ---- 手機 ---- */
  @media (max-width:860px){
    .mobile-only{display:inline-flex!important}
    .app{display:block;height:100dvh}
    .main{height:100dvh;overflow:auto}
    .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);z-index:45;transform:translateX(-105%);transition:transform .2s;border-right:1px solid var(--line);box-shadow:4px 0 20px rgba(0,0,0,.08)}
    body.side-open .side{transform:none}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
    body.side-open .backdrop, body.toc-open .backdrop{display:block}
    .lawhead{padding:8px 12px 8px;backdrop-filter:none;background:var(--bg)}
    .lawhead h2{font-size:17px}
    .titlerow{gap:6px}
    .toolbar{gap:6px}
    .toolbar .field{flex:1 1 60%;max-width:none}
    .toolbar .field.jump{flex:1 1 80px;min-width:0}
    .toolbar .btn{padding:6px 9px}
    .toolbar .spacer{display:none}
    .body{grid-template-columns:1fr}
    .toc{position:fixed;left:0;top:0;bottom:0;height:100dvh;align-self:stretch;width:min(82vw,320px);max-height:none;z-index:45;background:var(--panel);transform:translateX(-105%);transition:transform .2s;padding:0 8px 30px 12px}
    body.toc-open .toc{transform:none}
    .toc .tochead{display:flex;align-items:center;position:sticky;top:0;background:var(--panel);padding:12px 4px 8px;font-weight:700;font-size:15px}
    .toc .tochead .x{margin-left:auto}
    .content{padding:8px 10px 60px}
    .art{padding:8px 12px 10px}
    .art .copy{opacity:1}
    .menu{position:fixed;left:10px;right:10px;top:auto;bottom:10px;min-width:0;padding:8px;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
    .menu button{padding:12px}
    .banner{padding:8px 12px}
    .foot{padding:16px 14px 24px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div>
        <h1>法規查閱與匯出</h1>
        <div class="sub">網頁閱讀 · Obsidian · Word</div>
      </div>
      <button class="x mobile-only" id="closeSide" title="關閉">×</button>
    </div>
    <div class="search">
      <input id="q" class="field" type="search" placeholder="搜尋法規名稱，例如：刑法" autocomplete="off" disabled>
    </div>
    <div id="results" class="results"><div class="hint">尚未載入法規資料。</div></div>
    <div id="datainfo" class="datainfo" hidden></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main id="main" class="main">
    <div id="banner" class="banner" hidden><span id="bannerText"></span><button class="x" id="bannerX" title="關閉">×</button></div>
    <section id="empty" class="empty">
      <h2 id="emptyTitle">先載入法務部的法規資料</h2>
      <div id="emptyLocal">
        <div>資料只會存在這台電腦的瀏覽器裡，下次打開不用再載入。</div>
        <div class="steps">
          <ol>
            <li>下載「法律」資料檔：<a href="https://law.moj.gov.tw/api/Ch/Law/json" target="_blank" rel="noopener">law.moj.gov.tw/api/Ch/Law/json</a>（刑法、刑事訴訟法等都在這份）</li>
            <li>需要「命令」（施行細則、辦法、規則）的話，再下載：<a href="https://law.moj.gov.tw/api/Ch/Order/json" target="_blank" rel="noopener">law.moj.gov.tw/api/Ch/Order/json</a></li>
            <li>把下載的 zip 檔拖到下面的框裡（可以一次放兩個）。</li>
          </ol>
        </div>
        <label id="drop" class="drop">
          <strong>把 zip 檔拖到這裡，或點一下選擇檔案</strong>
          <span class="count">支援法務部的 .zip、.json、.xml 檔</span>
          <input id="file" type="file" accept=".zip,.json,.xml" multiple hidden>
        </label>
        <div id="status" class="status"></div>
      </div>
      <div id="emptyOnline" hidden>
        <p>請從法規清單選一部法規。</p>
        <button class="btn primary mobile-only" data-open-side>打開法規清單</button>
      </div>
    </section>
    <section id="lawview" hidden></section>
  </main>
</div>
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head"><b id="modalTitle"></b><button class="x" id="modalX" title="關閉">×</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="vendor/jszip.min.js"></script>
<script src="js/core.js"></script>
<script src="js/export.js"></script>
<script src="js/sync.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
